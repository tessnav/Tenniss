<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenis Turnaj 2026 - Žebříček</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
    <a href="/" class="home-link">🏠</a>
    <a href="/matches" class="nav-btn">Zápasy</a>
    <a href="/players" class="nav-btn">Žebříček</a>
</nav>
<div class="container">
    <h2>Žebříček Hráčů</h2>
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Jméno</th>
                <th>Výhry</th>
                <th>Skóre +</th>
                <th>Skóre -</th>
                <th>Rozdíl</th>
            </tr>
            </thead>
            <tbody>
            {{#players}}
            <tr>
                <td><strong>{{name}}</strong></td>
                <td>{{wins}}</td>
                <td>{{points_plus}}</td>
                <td>{{points_minus}}</td>
                <td style="color: var(--primary)">{{score_diff}}</td>
            </tr>
            {{/players}}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
