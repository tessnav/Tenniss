<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenis Turnaj 2026 - Zápasy</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
    <a href="/" class="home-link">🏠</a>
    <a href="/matches" class="nav-btn">Zápasy</a>
    <a href="/players" class="nav-btn">Žebříček</a>
</nav>
<div class="container">
    <h2>Rozpis a Výsledky</h2>
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Tým A</th>
                <th></th> <th class="score">Skóre</th>
                <th>Tým B</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            {{#matches}}
            <tr>
                <td><strong>{{p1_a}}</strong></td>
                <td><strong>{{p2_a}}</strong></td>
                <td class="score">{{score_a}} : {{score_b}}</td>
                <td><strong>{{p1_b}}</strong></td>
                <td><strong>{{p2_b}}</strong></td>
            </tr>
            {{/matches}}
            </tbody>
        </table>
    </div>
    <div class="rotation-notice">
        📱 Pro nejlepší zážitek z tabulek doporučujeme otočit telefon na šířku.
    </div>
</div>
</body>
</html>
